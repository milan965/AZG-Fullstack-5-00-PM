<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .btn{
            background-color: burlywood;
            border: none;

            padding: 10px 40px;
            border-top-left-radius: 10px;
            border-bottom-right-radius: 10px;
            transition: 1s all;

        }

        .btn:hover{
            background-color: rgb(30, 210, 198);
            color:white
        }

        table{
            margin-top: 50px;
            width: 100%;
        }

        th{
            background-color: chartreuse;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(2){
            background-color: cornflowerblue;
        }
    </style>

</head>
<body>
    
    <button class="btn">Click</button>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>City</th>

            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Jay</td>

            </tr>
            <tr>
                <td>aJay</td>

                <td>vapi</td>
            </tr>
            <tr>

        </tbody>

</body>
</html>
