<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

        <!-- font awesome cdn -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- header starts here -->
    <header>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-6">
                    <div class="menu">
                        <a>
                            <img width="50" src="./assets/images/logo.png" alt="Logo">
                        </a>

                        <ul>
                            <li><a href="#">Menu</a></li>
                            <li><a href="#">Rewards</a></li>
                            <li><a href="#">Gift Cards</a></li>
                        </ul>

                    </div>
                </div>
                <div class="col-6">
                    
                    <div class="signin">
                        <ul>
                            <li>
                                <a href="#">
                                    <i class="fa-solid fa-location-dot"></i>
                                    Find a Store</a>
                            </li>
                            <li>
                                <a>
                                    <button class="signinbtn">Sign In</button>
                                </a>
                            </li>
                             <li>
                                <a>
                                    <button class="joinbtn">Join Now</button>
                                </a>
                            </li>
                        </ul>
                    </div>

                </div>

            </div>
        </div>
    </header>



    <main>

        <!-- order section -->
        <section class="order-section">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="order align-items-center">
                            <p>It's a great day for coffee</p>
                            <button class="btn">Start an order</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>



        <!-- grads start -->
        <section class="grads">
            <div class="container">
                <div class="row">
                    <div class="col-6">
                        <div class="grads-image">
                            <img width="100%" src="assets/images/grads.webp" alt="grads-image"/>
                        </div>
                    </div>


                    <div class="col-6">
                        <div class="grads-content">
                            <h2>Cheers to the grads!</h2>
                            <p>Celebrate their achievements and new beginnings <br/> with a Starbucks gift card.</p>
                            <button class="btn grads-btn">Send an eGift</button>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </main>




    <footer>
        
    </footer>

</body>

</html>
