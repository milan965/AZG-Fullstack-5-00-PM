        // task 4

        class University{
            constructor(name){
                this.name = name;
                this.departments = []
            }

            addDepartments(dep){
                this.departments.push(dep);
                console.log(`department successfully add`);
                
            }

            viewDepartments(){
                console.log(`----view departments----`);
                
                this.departments.forEach((value)=>{
                    console.log(value);
                    
                })
            }

            removeDepartments(dept){
                let ans = this.departments.filter((value)=>{
                    return value != dept
                })
                
                this.departments = ans;
                console.log(`department successfully remove`);
                
            }
        }

        let uni = new University("ABC University");
        uni.addDepartments("Science");
        uni.addDepartments("Computer");
        uni.addDepartments("Commerce");

        uni.viewDepartments();

        uni.addDepartments("Arts");
        uni.viewDepartments();

        uni.removeDepartments("Science");
        uni.viewDepartments();

        uni.removeDepartments("Commerce");
        uni.viewDepartments();
