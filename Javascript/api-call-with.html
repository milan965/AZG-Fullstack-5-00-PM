
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Data - Bootstrap UI</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">API Dashboard</a>
        </div>
    </nav>

    <div class="container py-5">

        <!-- Posts Section -->
        <h2 class="mb-4">Latest Posts</h2>

        <div id="postLoader" class="text-primary mb-3">
            Loading posts...
        </div>

        <div id="posts" class="row g-4 mb-5"></div>

        <!-- Products Section -->
        <h2 class="mb-4">Our Products</h2>

        <div id="productLoader" class="text-primary mb-3">
            Loading products...
        </div>

        <div id="products" class="row g-4"></div>

    </div>

    <script>
        // Get Posts API
        const getPosts = async () => {
            const container = document.getElementById("posts");
            const loader = document.getElementById("postLoader");

            try {
                const response = await fetch(
                    "https://dummyjson.com/posts"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch posts");
                }

                const data = await response.json();

                loader.style.display = "none";

                data.posts.forEach(post => {
                    container.innerHTML += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-body">
                                    <span class="badge bg-primary mb-2">
                                        Post #${post.id}
                                    </span>

                                    <h5 class="card-title">
                                        ${post.title}
                                    </h5>

                                    <p class="card-text text-secondary">
                                        ${post.body}
                                    </p>

                                    <div class="mb-3">
                                        ${post.tags.map(tag => `
                                            <span class="badge bg-light text-dark border me-1">
                                                #${tag}
                                            </span>
                                        `).join("")}
                                    </div>

                                    <div class="d-flex justify-content-between text-secondary small">
                                        <span>👍 ${post.reactions.likes}</span>
                                        <span>👎 ${post.reactions.dislikes}</span>
                                        <span>👁 ${post.views} views</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                loader.className = "alert alert-danger";
                loader.textContent = error.message;
            }
        };


        // Get Products API
        const getProducts = async () => {
            const container = document.getElementById("products");
            const loader = document.getElementById("productLoader");

            try {
                const response = await fetch(
                    "https://dummyjson.com/products"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch products");
                }

                const data = await response.json();

                loader.style.display = "none";

                data.products.forEach(product => {
                    container.innerHTML += `
                        <div class="col-sm-6 col-lg-4 col-xl-3">
                            <div class="card h-100 shadow-sm border-0">

                                <img
                                    src="${product.thumbnail}"
                                    class="card-img-top p-3"
                                    alt="${product.title}"
                                    style="height: 220px; object-fit: contain;"
                                >

                                <div class="card-body d-flex flex-column">

                                    <span class="badge bg-success align-self-start mb-2">
                                        ${product.category}
                                    </span>

                                    <h5 class="card-title">
                                        ${product.title}
                                    </h5>

                                    <p class="card-text text-secondary small">
                                        ${product.description}
                                    </p>

                                    <div class="mt-auto">
                                        <h4 class="text-primary">
                                            $${product.price}
                                        </h4>

                                        <p class="mb-3">
                                            ⭐ ${product.rating}
                                            <span class="text-secondary">
                                                | ${product.availabilityStatus}
                                            </span>
                                        </p>

                                        <button
                                            class="btn btn-primary w-100"
                                            onclick="showProduct(${product.id})">
                                            View Product
                                        </button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                loader.className = "alert alert-danger";
                loader.textContent = error.message;
            }
        };


        // View Product Details
        async function showProduct(id) {
            try {
                const response = await fetch(
                    `https://dummyjson.com/products/${id}`
                );

                if (!response.ok) {
                    throw new Error("Product not found");
                }

                const product = await response.json();

                alert(
                    "Product: " + product.title +
                    "\nPrice: $" + product.price +
                    "\nBrand: " + (product.brand || "N/A") +
                    "\nRating: " + product.rating
                );

            } catch (error) {
                alert(error.message);
            }
        }


        // Call both APIs
        getPosts();
        getProducts();
    </script>

</body>
</html>
