<html>
	<head>
		<title>Form</title>
	</head>
	<body>
		
		<form action="" method="post" autocomplete="">
			<label>Name :- </label>
			<input type="text" name="name" id="name" placeholder="Enter your name"/>
			<br/><br/>
			<label>Password :- </label>
			<input type="password" placeholder="Enter password"/>
			<br/><br/>
			<label>Email :- </label>
			<input type="email" placeholder="Enter email"/>
			<br/><br/>
			<label>Number :- </label>
			<input type="number" min="0" max="10"/>
			<br/><br/>
			<label>Tel :- </label>
			<input type="tel" placeholder="Enter Telephone number"/>
			<br/><br/>
			<label>Url :- </label>
			<input type="url" placeholder="Enter url"/>
			<br/><br/>
			<label>Date :- </label>
			<input type="date"/>
			<br/><br/>
			<label>Date And Time</label>
			<input type="datetime-local"/>
			<br/><br/>
			<label>Week :- </label>
			<input type="week"/>
			<br/><br/>
			<label>Time :- </label>
			<input type="time"/>
			<br/><br/>
			<label>Gender :- </label>
			<input type="radio" name="gender" checked/>Male
			<input type="radio" name="gender" />Female
			<br/><br/>
			<label>Hobby :- </label>
			<input type="checkbox"/>Cricket
			<input type="checkbox" checked/>Music
			<input type="checkbox"/>Travelling
			<br/><br/>
			<label>Range :- </label>
			<input type="range" min="0" max="100"/>
			<br/><br/>
			<label>Color :- </label>
			<input type="color"/>
			<br/><br/>
			<label>File :- </label>
			<input type="file"/>
			<br/><br/>
			<label>Hidden :- </label>
			<input type="hidden" value="1234"/>
			<br/><br/>
			<input type="submit" value="submit"/>
			<input type="reset" value="reset"/>
			<br/><br/>
			<label>Search :- </label>
			<input type="search" value="Enter search"/>
		</form>
		
	</body>
</html>
